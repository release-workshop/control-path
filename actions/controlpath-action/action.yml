name: 'Control Path'
description: 'Validate and compile Control Path v2 catalogs in CI (Linux only)'
branding:
  icon: 'layers'
  color: 'blue'
inputs:
  environment:
    description: 'Environment name to validate and compile (from control-path.yaml)'
    required: false
  version:
    description: 'Control Path CLI version to use (default: latest)'
    required: false
    default: 'latest'
  skip-validation:
    description: 'Skip validation step (default: false)'
    required: false
    default: 'false'
  skip-compilation:
    description: 'Skip compilation step (default: false)'
    required: false
    default: 'false'
outputs:
  compiled-artifact-path:
    description: 'Path to the compiled AST artifact file'
    value: ${{ steps.compile.outputs.artifact-path }}
runs:
  using: 'node20'
  main: 'index.js'
