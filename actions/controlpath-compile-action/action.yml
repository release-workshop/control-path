name: 'Control Path Compile'
description: 'Compile Control Path v2 catalogs to AST artifacts for runtime use. Optionally validates before compilation (Linux only)'
branding:
  icon: 'layers'
  color: 'blue'
inputs:
  environment:
    description: 'Environment name to validate and compile (from control-path.yaml)'
    required: false
  version:
    description: 'Control Path CLI version to use (default: latest)'
    required: false
    default: 'latest'
  skip-compilation:
    description: 'Skip compilation step (default: false)'
    required: false
    default: 'false'
  working-directory:
    description: 'Working directory for the action. Use this for monorepos where Control Path files are in subdirectories (e.g., packages/service-a)'
    required: false
outputs:
  compiled-artifact-path:
    description: 'Path to the compiled AST artifact file'
runs:
  using: 'node20'
  main: 'index.js'
