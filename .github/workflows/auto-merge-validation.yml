name: Auto-merge validation

on:
  push:
    branches:
      - 'validation/**'

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      compiler: ${{ steps.filter.outputs.compiler }}
      cli: ${{ steps.filter.outputs.cli }}
      workspace: ${{ steps.filter.outputs.workspace }}
      typescript: ${{ steps.filter.outputs.typescript }}
      workflows: ${{ steps.filter.outputs.workflows }}
      e2e: ${{ steps.filter.outputs.e2e }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MAINLINE_MERGE_TOKEN }}

      - name: Detect changes (vs main)
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: main
          filters: |
            compiler:
              - 'crates/compiler/**'
              - 'schemas/**'
            cli:
              - 'crates/cli/**'
            workspace:
              - 'Cargo.toml'
              - 'Cargo.lock'
            typescript:
              - 'runtime/typescript/**'
            workflows:
              - '.github/workflows/**'
            e2e:
              - 'tests/e2e/**'
            docs:
              - 'docs/**'
              - '**/*.md'

  # Fast Rust gates: fmt, clippy, affected package tests, release CLI (no coverage upload).
  rust-land:
    name: Rust land gates
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.compiler == 'true' ||
      needs.changes.outputs.cli == 'true' ||
      needs.changes.outputs.workspace == 'true' ||
      needs.changes.outputs.workflows == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MAINLINE_MERGE_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run affected Rust tests
        env:
          WORKFLOWS: ${{ needs.changes.outputs.workflows }}
          WORKSPACE: ${{ needs.changes.outputs.workspace }}
          CLI: ${{ needs.changes.outputs.cli }}
          COMPILER: ${{ needs.changes.outputs.compiler }}
        run: |
          set -euo pipefail
          if [ "$WORKFLOWS" = "true" ] || [ "$WORKSPACE" = "true" ]; then
            echo "Running full workspace tests (workflows or workspace manifest changed)"
            cargo test --workspace
          elif [ "$CLI" = "true" ]; then
            echo "Running CLI + compiler tests"
            cargo test -p controlpath-cli -p controlpath-compiler
          elif [ "$COMPILER" = "true" ]; then
            echo "Running compiler tests"
            cargo test -p controlpath-compiler
          else
            echo "No Rust packages selected for test"
            exit 1
          fi

      - name: Build release CLI binary
        run: cargo build --release --bin controlpath

      - name: Upload release CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: controlpath-cli-release
          path: target/release/controlpath
          retention-days: 1

  # Release CLI only when TypeScript/e2e changed without a Rust-land job.
  build-cli:
    name: Build CLI binary
    runs-on: ubuntu-latest
    needs: changes
    if: |
      (
        needs.changes.outputs.typescript == 'true' ||
        needs.changes.outputs.e2e == 'true'
      ) &&
      needs.changes.outputs.compiler != 'true' &&
      needs.changes.outputs.cli != 'true' &&
      needs.changes.outputs.workspace != 'true' &&
      needs.changes.outputs.workflows != 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MAINLINE_MERGE_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release CLI binary
        run: cargo build --release --bin controlpath

      - name: Upload release CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: controlpath-cli-release
          path: target/release/controlpath
          retention-days: 1

  typescript-tests:
    name: Run TypeScript tests
    runs-on: ubuntu-latest
    needs: [changes, rust-land, build-cli]
    if: |
      always() &&
      (needs.rust-land.result == 'success' || needs.rust-land.result == 'skipped') &&
      (needs.build-cli.result == 'success' || needs.build-cli.result == 'skipped') &&
      (
        needs.changes.outputs.typescript == 'true' ||
        needs.changes.outputs.workflows == 'true'
      )
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MAINLINE_MERGE_TOKEN }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('runtime/typescript/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        working-directory: runtime/typescript
        run: npm ci

      - name: Download release CLI binary
        uses: actions/download-artifact@v4
        with:
          name: controlpath-cli-release
          path: ${{ runner.temp }}/cli-artifact

      - name: Install CLI binary
        run: |
          mkdir -p target/release
          if [ -f "${{ runner.temp }}/cli-artifact/controlpath" ]; then
            cp "${{ runner.temp }}/cli-artifact/controlpath" target/release/controlpath
          elif [ -f "${{ runner.temp }}/cli-artifact/target/release/controlpath" ]; then
            cp "${{ runner.temp }}/cli-artifact/target/release/controlpath" target/release/controlpath
          else
            echo "❌ Error: CLI binary not found in artifact"
            find "${{ runner.temp }}/cli-artifact" -type f || echo "No files found"
            exit 1
          fi
          chmod +x target/release/controlpath

      - name: Run runtime SDK tests
        working-directory: runtime/typescript
        run: npm test

  lint-and-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.typescript == 'true' ||
      needs.changes.outputs.workflows == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MAINLINE_MERGE_TOKEN }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('runtime/typescript/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        working-directory: runtime/typescript
        run: npm ci

      - name: Lint
        working-directory: runtime/typescript
        run: npm run lint

      - name: Typecheck
        working-directory: runtime/typescript
        run: npm run typecheck

  pre-merge-e2e-smoke:
    name: E2E smoke (pre-merge)
    runs-on: ubuntu-latest
    needs: [changes, rust-land, build-cli]
    if: |
      always() &&
      (needs.rust-land.result == 'success' || needs.rust-land.result == 'skipped') &&
      (needs.build-cli.result == 'success' || needs.build-cli.result == 'skipped') &&
      (
        needs.changes.outputs.compiler == 'true' ||
        needs.changes.outputs.cli == 'true' ||
        needs.changes.outputs.workspace == 'true' ||
        needs.changes.outputs.typescript == 'true' ||
        needs.changes.outputs.e2e == 'true' ||
        needs.changes.outputs.workflows == 'true'
      )
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MAINLINE_MERGE_TOKEN }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download release CLI binary
        uses: actions/download-artifact@v4
        with:
          name: controlpath-cli-release
          path: ${{ runner.temp }}/cli-artifact

      - name: Install CLI binary
        run: |
          mkdir -p target/release
          if [ -f "${{ runner.temp }}/cli-artifact/controlpath" ]; then
            cp "${{ runner.temp }}/cli-artifact/controlpath" target/release/controlpath
          elif [ -f "${{ runner.temp }}/cli-artifact/target/release/controlpath" ]; then
            cp "${{ runner.temp }}/cli-artifact/target/release/controlpath" target/release/controlpath
          else
            echo "❌ Error: CLI binary not found in artifact"
            find "${{ runner.temp }}/cli-artifact" -type f || echo "No files found"
            exit 1
          fi
          chmod +x target/release/controlpath

      - name: Cache npm dependencies (runtime)
        uses: actions/cache@v4
        with:
          path: runtime/typescript/node_modules
          key: npm-runtime-${{ runner.os }}-${{ hashFiles('runtime/typescript/package-lock.json') }}
          restore-keys: |
            npm-runtime-${{ runner.os }}-

      - name: Install and build runtime SDK
        working-directory: runtime/typescript
        run: |
          npm ci
          npm run build

      - name: Cache npm dependencies (e2e)
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            tests/e2e/node_modules
          key: npm-e2e-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}
          restore-keys: |
            npm-e2e-${{ runner.os }}-

      - name: Install e2e test dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Run E2E smoke tests
        working-directory: tests/e2e
        run: npm run test:smoke

  docs-land:
    name: Docs land gate
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.docs == 'true' &&
      needs.changes.outputs.compiler != 'true' &&
      needs.changes.outputs.cli != 'true' &&
      needs.changes.outputs.workspace != 'true' &&
      needs.changes.outputs.typescript != 'true' &&
      needs.changes.outputs.e2e != 'true' &&
      needs.changes.outputs.workflows != 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MAINLINE_MERGE_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  merge:
    name: Merge into main
    runs-on: ubuntu-latest
    needs:
      - changes
      - rust-land
      - build-cli
      - typescript-tests
      - lint-and-typecheck
      - pre-merge-e2e-smoke
      - docs-land
    if: |
      always() &&
      (needs.rust-land.result == 'success' || needs.rust-land.result == 'skipped') &&
      (needs.build-cli.result == 'success' || needs.build-cli.result == 'skipped') &&
      (needs.typescript-tests.result == 'success' || needs.typescript-tests.result == 'skipped') &&
      (needs.lint-and-typecheck.result == 'success' || needs.lint-and-typecheck.result == 'skipped') &&
      (needs.pre-merge-e2e-smoke.result == 'success' || needs.pre-merge-e2e-smoke.result == 'skipped') &&
      (needs.docs-land.result == 'success' || needs.docs-land.result == 'skipped') &&
      (
        needs.changes.outputs.compiler == 'true' ||
        needs.changes.outputs.cli == 'true' ||
        needs.changes.outputs.workspace == 'true' ||
        needs.changes.outputs.typescript == 'true' ||
        needs.changes.outputs.e2e == 'true' ||
        needs.changes.outputs.workflows == 'true' ||
        (
          needs.changes.outputs.docs == 'true' &&
          needs.changes.outputs.compiler != 'true' &&
          needs.changes.outputs.cli != 'true' &&
          needs.changes.outputs.workspace != 'true' &&
          needs.changes.outputs.typescript != 'true' &&
          needs.changes.outputs.e2e != 'true' &&
          needs.changes.outputs.workflows != 'true'
        )
      )
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MAINLINE_MERGE_TOKEN }}

      - name: Rebase validation branch onto main for clean history
        env:
          GITHUB_TOKEN: ${{ secrets.MAINLINE_MERGE_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git config user.name "chrisbot-release-workshop"
          git config user.email "chris+bot@releaseworkshop.com"

          VALIDATION_BRANCH="${{ github.ref_name }}"
          MAX_RETRIES=3
          RETRY_DELAY=5

          retry_git_operation() {
            local operation="$1"
            local max_attempts=$2
            local attempt=1

            while [ $attempt -le $max_attempts ]; do
              echo "Attempt $attempt of $max_attempts: $operation"
              if eval "$operation"; then
                return 0
              fi
              if [ $attempt -lt $max_attempts ]; then
                echo "Operation failed, waiting ${RETRY_DELAY}s before retry..."
                sleep $RETRY_DELAY
                git fetch origin main --quiet || true
              fi
              attempt=$((attempt + 1))
            done
            return 1
          }

          echo "Fetching latest changes from main..."
          retry_git_operation "git fetch origin main" $MAX_RETRIES || {
            echo "❌ Failed to fetch main after $MAX_RETRIES attempts"
            exit 1
          }

          if git merge-base --is-ancestor origin/main "origin/${VALIDATION_BRANCH}"; then
            echo "✓ Validation branch is already up to date with main, skipping rebase"
          else
            echo "Rebasing ${VALIDATION_BRANCH} onto main..."
            retry_git_operation "git rebase origin/main" $MAX_RETRIES || {
              echo "❌ Rebase failed after $MAX_RETRIES attempts."
              exit 1
            }

            echo "Pushing rebased branch..."
            retry_git_operation "git push origin HEAD:${VALIDATION_BRANCH} --force-with-lease" $MAX_RETRIES || {
              echo "❌ Failed to push rebased branch after $MAX_RETRIES attempts"
              exit 1
            }
          fi

      - name: Fast-forward merge into main (no merge commit)
        env:
          GITHUB_TOKEN: ${{ secrets.MAINLINE_MERGE_TOKEN }}
        run: |
          VALIDATION_BRANCH="${{ github.ref_name }}"
          MAX_RETRIES=3
          RETRY_DELAY=5

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          retry_git_operation() {
            local operation="$1"
            local max_attempts=$2
            local attempt=1

            while [ $attempt -le $max_attempts ]; do
              echo "Attempt $attempt of $max_attempts: $operation"
              if eval "$operation"; then
                return 0
              fi
              if [ $attempt -lt $max_attempts ]; then
                echo "Operation failed, waiting ${RETRY_DELAY}s before retry..."
                sleep $RETRY_DELAY
                git fetch origin main "${VALIDATION_BRANCH}" --quiet || true
              fi
              attempt=$((attempt + 1))
            done
            return 1
          }

          echo "Fetching latest changes..."
          retry_git_operation "git fetch origin main ${VALIDATION_BRANCH}" $MAX_RETRIES || {
            echo "❌ Failed to fetch latest changes after $MAX_RETRIES attempts"
            exit 1
          }

          echo "Checking out main branch..."
          git checkout main
          retry_git_operation "git reset --hard origin/main" $MAX_RETRIES || {
            echo "❌ Failed to reset main branch after $MAX_RETRIES attempts"
            exit 1
          }

          if ! git rev-parse --verify "origin/${VALIDATION_BRANCH}" >/dev/null 2>&1; then
            echo "❌ Validation branch origin/${VALIDATION_BRANCH} does not exist"
            exit 1
          fi

          if git merge-base --is-ancestor "origin/${VALIDATION_BRANCH}" origin/main; then
            echo "✓ Validation branch is already merged into main, skipping merge"
          else
            echo "Attempting fast-forward merge of ${VALIDATION_BRANCH} into main..."
            retry_git_operation "git merge --ff-only \"origin/${VALIDATION_BRANCH}\"" $MAX_RETRIES || {
              echo "❌ Fast-forward merge failed after $MAX_RETRIES attempts."
              exit 1
            }

            echo "Pushing main with fast-forward merge..."
            retry_git_operation "git push origin main --no-verify" $MAX_RETRIES || {
              echo "❌ Failed to push main after $MAX_RETRIES attempts"
              exit 1
            }

            echo "✓ Fast-forward merge successful - no merge commit created"
          fi

          echo "Deleting validation branch ${VALIDATION_BRANCH}..."
          git push origin --delete "${VALIDATION_BRANCH}" || {
            echo "⚠️  Warning: Failed to delete validation branch (may have already been deleted)"
          }
          echo "✓ Validation branch cleaned up"
