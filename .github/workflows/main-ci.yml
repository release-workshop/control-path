name: Main CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

jobs:
  # Run Rust tests in parallel with CLI build and lint/typecheck
  rust-tests:
    name: Run Rust tests and clippy
    runs-on: ubuntu-latest
    if: github.ref_name != 'release-please--branches--main' && github.head_ref != 'release-please--branches--main'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache npm dependencies (runtime)
        uses: actions/cache@v4
        with:
          path: runtime/typescript/node_modules
          key: npm-runtime-${{ runner.os }}-${{ hashFiles('runtime/typescript/package-lock.json') }}
          restore-keys: |
            npm-runtime-${{ runner.os }}-

      - name: Build TypeScript runtime (CLI integration evaluation)
        working-directory: runtime/typescript
        run: |
          npm ci
          npm run build

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --workspace

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Workspace tests (compiler + CLI) with report-only coverage (see testing-and-quality-gates.md)
      - name: Run Rust tests with coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path rust-lcov.info

      - name: Upload Rust coverage report
        uses: codecov/codecov-action@v4
        with:
          files: rust-lcov.info
          flags: rust
          fail_ci_if_error: false

  # Build CLI binary in parallel with rust-tests
  # This maximizes parallelization - CLI build doesn't wait for tests
  build-cli:
    name: Build CLI binary
    runs-on: ubuntu-latest
    if: github.ref_name != 'release-please--branches--main' && github.head_ref != 'release-please--branches--main'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Build release binary for TypeScript tests
      # This runs in parallel with rust-tests, maximizing speed
      - name: Build release CLI binary
        run: cargo build --release --bin controlpath

      # Upload release binary for TypeScript tests job
      - name: Upload release CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: controlpath-cli-release
          path: target/release/controlpath
          retention-days: 1

  # Run TypeScript tests (depends only on CLI build, not rust-tests)
  # This starts as soon as CLI is ready, maximizing parallelization
  typescript-tests:
    name: Run TypeScript tests
    runs-on: ubuntu-latest
    needs: [build-cli]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('runtime/typescript/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      # Install dependencies for TypeScript runtime SDK only
      # Note: This is not a workspace - only runtime/typescript uses npm
      # Using npm ci for consistent, reproducible builds in CI
      - name: Install dependencies
        working-directory: runtime/typescript
        run: npm ci

      # Download release CLI binary from build-cli job
      - name: Download release CLI binary
        uses: actions/download-artifact@v4
        with:
          name: controlpath-cli-release
          path: ${{ runner.temp }}/cli-artifact

      # Install CLI binary to correct location
      - name: Install CLI binary
        run: |
          mkdir -p target/release
          # Find the binary in the downloaded artifact
          if [ -f "${{ runner.temp }}/cli-artifact/controlpath" ]; then
            cp "${{ runner.temp }}/cli-artifact/controlpath" target/release/controlpath
          elif [ -f "${{ runner.temp }}/cli-artifact/target/release/controlpath" ]; then
            cp "${{ runner.temp }}/cli-artifact/target/release/controlpath" target/release/controlpath
          else
            echo "❌ Error: CLI binary not found in artifact"
            echo "Artifact contents:"
            find "${{ runner.temp }}/cli-artifact" -type f || echo "No files found"
            exit 1
          fi
          chmod +x target/release/controlpath
          echo "✓ CLI binary installed at target/release/controlpath"

      - name: Run runtime SDK tests with coverage
        working-directory: runtime/typescript
        run: |
          npm test -- --coverage --reporter=default --coverage.reporter=lcov

  # Run lint and typecheck in parallel (separate job for TypeScript SDK only)
  lint-and-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    if: github.ref_name != 'release-please--branches--main' && github.head_ref != 'release-please--branches--main'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # npm is only needed for the TypeScript runtime SDK (runtime/typescript/)
      # The compiler and CLI are now Rust-based and use Cargo
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('runtime/typescript/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      # Install dependencies for TypeScript runtime SDK only
      # Note: This is not a workspace - only runtime/typescript uses npm
      # Using npm ci for consistent, reproducible builds in CI
      - name: Install dependencies
        working-directory: runtime/typescript
        run: npm ci

      # Lint and typecheck only affect the TypeScript runtime SDK
      - name: Lint
        working-directory: runtime/typescript
        run: npm run lint

      - name: Typecheck
        working-directory: runtime/typescript
        run: npm run typecheck

  # Fast SDK-generator smoke: CLI → compile → generate-sdk → evaluator (full suite is post-merge)
  pre-merge-e2e-smoke:
    name: E2E smoke (pre-merge)
    runs-on: ubuntu-latest
    needs: [build-cli]
    if: github.ref_name != 'release-please--branches--main' && github.head_ref != 'release-please--branches--main'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download release CLI binary
        uses: actions/download-artifact@v4
        with:
          name: controlpath-cli-release
          path: ${{ runner.temp }}/cli-artifact

      - name: Install CLI binary
        run: |
          mkdir -p target/release
          if [ -f "${{ runner.temp }}/cli-artifact/controlpath" ]; then
            cp "${{ runner.temp }}/cli-artifact/controlpath" target/release/controlpath
          elif [ -f "${{ runner.temp }}/cli-artifact/target/release/controlpath" ]; then
            cp "${{ runner.temp }}/cli-artifact/target/release/controlpath" target/release/controlpath
          else
            echo "❌ Error: CLI binary not found in artifact"
            find "${{ runner.temp }}/cli-artifact" -type f || echo "No files found"
            exit 1
          fi
          chmod +x target/release/controlpath

      - name: Cache npm dependencies (runtime)
        uses: actions/cache@v4
        with:
          path: runtime/typescript/node_modules
          key: npm-runtime-${{ runner.os }}-${{ hashFiles('runtime/typescript/package-lock.json') }}
          restore-keys: |
            npm-runtime-${{ runner.os }}-

      - name: Install and build runtime SDK
        working-directory: runtime/typescript
        run: |
          npm ci
          npm run build

      - name: Cache npm dependencies (e2e)
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            tests/e2e/node_modules
          key: npm-e2e-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}
          restore-keys: |
            npm-e2e-${{ runner.os }}-

      - name: Install e2e test dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Run E2E smoke tests
        working-directory: tests/e2e
        run: npm run test:smoke
